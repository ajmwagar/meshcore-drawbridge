[package]
name = "meshcore-drawbridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "MeshCore to Matrix application-service bridge built on Drawbridge"
repository = "https://github.com/ajmwagar/meshcore-drawbridge"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
drawbridge-appservice = { git = "https://github.com/ajmwagar/drawbridge", rev = "f88562d6d226ec8644cd3905c65d28bcb2b75b13" }
drawbridge-core = { git = "https://github.com/ajmwagar/drawbridge", rev = "f88562d6d226ec8644cd3905c65d28bcb2b75b13" }
drawbridge-matrix = { git = "https://github.com/ajmwagar/drawbridge", rev = "f88562d6d226ec8644cd3905c65d28bcb2b75b13" }
drawbridge-store = { git = "https://github.com/ajmwagar/drawbridge", rev = "f88562d6d226ec8644cd3905c65d28bcb2b75b13" }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
