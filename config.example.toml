# Paths resolve relative to this file. Secrets belong in files referenced by
# *_FILE env vars, never in this repository.
database = "data/meshcore-drawbridge.db"
encryption_key_env = "MESHCORE_DRAWBRIDGE_KEY"
listen = "127.0.0.1:8080"
poll_seconds = 2

# Exact values from `bbctl register --json sh-meshcore`.
owner = "@YOUR_USER:beeper.com"
homeserver = "https://matrix.beeper.com/_hungryserv/YOUR_USER"
registration = "secrets/registration.json"
tenant = "personal"
# Opt-in: accept Matrix room invites for the owner. This is a user-level
# credential; leave it unset to keep rooms invite-only.
# owner_token_env = "MESHCORE_DRAWBRIDGE_OWNER"

# Bridge these channel indexes. Empty means every inbound channel.
channels = [0]
# Bridge these contact pubkey prefixes. Empty means every inbound DM.
contacts = []
# Create a Matrix room on first contact; disable to require an existing binding.
auto_create_rooms = true
# Replay old sidecar messages on first run. Off = start at the latest message.
backfill = false

[meshcore]
url = "http://127.0.0.1:8787"
token_env = "MESHCORE_TOKEN"
default_channel = 0
